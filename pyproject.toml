[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polytrading"
version = "0.1.0"
description = "Point-in-time market-neutral trading research"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "duckdb==1.5.4",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.160.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]

[project.scripts]
polytrading = "polytrading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polytrading.storage.schema" = ["*.sql"]
"polytrading.web.assets" = ["*.html", "*.css", "*.js"]
"polytrading.carry.dossiers" = ["*.json"]
"polytrading.predictions.storage.schema" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
